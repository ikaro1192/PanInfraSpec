name: CI

on:
  # Only run `push` for main; PR branches are covered by `pull_request`.
  # Triggering push on every branch caused push and pull_request to share
  # the concurrency group below and cancel each other (re-running the
  # canceled push then cancels the PR run, etc.). Restricting push to
  # main eliminates the duplicate entirely.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs when a newer commit lands on the same branch.
# `github.head_ref` is set on pull_request events to the source branch and
# empty otherwise; falling back to `github.ref_name` gives a stable key for
# both event types.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    # Default job timeout is 360 minutes; cap at 20 so a stuck cabal-test step
    # surfaces as a quick failure instead of sitting for hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Disable autocrlf (Windows) so golden fixtures keep LF
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - id: setup
        # haskell-actions/setup@v2.11.0
        uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.10'

      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('**/cabal.project.freeze', '**/*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-ghc${{ steps.setup.outputs.ghc-version }}-

      - name: Patch freeze for Windows zlib (use bundled-c-zlib, no pkg-config)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/zlib -bundled-c-zlib +non-blocking-ffi +pkg-config/zlib +bundled-c-zlib +non-blocking-ffi -pkg-config/' cabal.project.freeze
          grep '^             zlib ' cabal.project.freeze

      - run: cabal update
      - run: cabal build all --enable-tests
      # `direct` connects the test executable's stdout/stderr straight to the
      # job log instead of going through cabal's streaming pipe, which has been
      # observed to deadlock at EOF on all three OSes.
      - name: cabal test (POSIX)
        if: runner.os != 'Windows'
        run: cabal test all --test-show-details=direct
      # Windows runners have been observed to hang in tasty's parallel scheduler
      # during `cabal test all`; force the test executable to a single worker.
      - name: cabal test (Windows, serialized)
        if: runner.os == 'Windows'
        shell: bash
        run: cabal test all --test-show-details=direct --test-options=--num-threads=1
