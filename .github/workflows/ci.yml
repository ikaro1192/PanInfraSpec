name: CI

on:
  # Only run `push` for main; PR branches are covered by `pull_request`.
  # Triggering push on every branch caused push and pull_request to share
  # the concurrency group below and cancel each other (re-running the
  # canceled push then cancels the PR run, etc.). Restricting push to
  # main eliminates the duplicate entirely.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs when a newer commit lands on the same branch.
# `github.head_ref` is set on pull_request events to the source branch and
# empty otherwise; falling back to `github.ref_name` gives a stable key for
# both event types.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    # Default job timeout is 360 minutes; cap at 20 so a stuck cabal-test step
    # surfaces as a quick failure instead of sitting for hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Disable autocrlf (Windows) so golden fixtures keep LF
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - id: setup
        # haskell-actions/setup@v2.11.0
        uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.10'

      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('**/cabal.project.freeze', '**/*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-ghc${{ steps.setup.outputs.ghc-version }}-

      - name: Patch freeze for Windows zlib (use bundled-c-zlib, no pkg-config)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/zlib -bundled-c-zlib +non-blocking-ffi +pkg-config/zlib +bundled-c-zlib +non-blocking-ffi -pkg-config/' cabal.project.freeze
          grep '^             zlib ' cabal.project.freeze

      - run: cabal update
      - run: cabal build all --enable-tests
      # `direct` connects the test executable's stdout/stderr straight to the
      # job log instead of going through cabal's streaming pipe, which has been
      # observed to deadlock at EOF on all three OSes.
      - name: cabal test (POSIX)
        if: runner.os != 'Windows'
        run: cabal test all --test-show-details=direct
      # Windows runners have been observed to hang in tasty's parallel scheduler
      # during `cabal test all`; force the test executable to a single worker.
      - name: cabal test (Windows, serialized)
        if: runner.os == 'Windows'
        shell: bash
        run: cabal test all --test-show-details=direct --test-options=--num-threads=1

  nix-build:
    name: nix build
    # Nix builds pull most deps from cache.nixos.org; only paninfraspec itself
    # is built locally. 30 min leaves headroom if the binary cache is cold.
    timeout-minutes: 30
    # magic-nix-cache uses OIDC to authenticate against the GitHub Actions
    # cache; `id-token: write` is required. Scope it to this job rather than
    # the top-level permissions block so other jobs stay read-only.
    permissions:
      contents: read
      id-token: write
    # Linux only: macOS GitHub-hosted runners are several times slower and the
    # Darwin builds in flake.nix mostly just re-validate cabal2nix wiring that
    # is already exercised on Linux. The flake's other systems (aarch64-linux,
    # x86_64-darwin, aarch64-darwin) remain declared for local/Nix users.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        # cachix/install-nix-action@v31.10.5
        uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Caches /nix/store paths built in this workflow to the GitHub Actions
      # cache so subsequent runs skip rebuilding paninfraspec and any deps not
      # already on cache.nixos.org. Free, no account/secret required.
      - name: Set up Nix store cache
        # DeterminateSystems/magic-nix-cache-action@v13
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39

      # Surface flake evaluation errors before the (slower) build step.
      - run: nix flake show
      - run: nix build .#paninfraspec --print-build-logs
